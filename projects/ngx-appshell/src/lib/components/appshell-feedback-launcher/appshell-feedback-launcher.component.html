<!-- Rendered into the overlay container, above the page's own chrome: see the
     constructor. -->
<ng-template #trigger>
@if (!hidden()) {
    <button
        class="appshell-feedback-launcher"
        [class.appshell-feedback-launcher--tab]="shape() === 'tab'"
        [class.appshell-feedback-launcher--left]="side() === 'left'"
        type="button"
        (click)="open()"
        [matTooltip]="shape() === 'fab' ? label() : ''"
        [matTooltipPosition]="side() === 'left' ? 'right' : 'left'"
        [attr.aria-haspopup]="'dialog'"
        [attr.aria-expanded]="isOpen()"
        [attr.aria-label]="label()">
        <appshell-icon [icon]="icon()" aria-hidden="true" />
        @if (shape() === 'tab') {
            <span class="launcher-label">{{ label() }}</span>
        }
    </button>
}
</ng-template>

<!-- Rendered into the dialog, not here, so the questionnaire is only ever built
     once the trigger has actually been pressed. -->
<ng-template #dialogContent>
    <appshell-feedback
        [feedback]="questionnaire()"
        (submitted)="onSubmitted($event)"
        (dismissed)="close()" />
</ng-template>
